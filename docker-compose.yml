services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: paragraf
      POSTGRES_PASSWORD: paragraf        # local development only; Project 3 moves secrets out of files
      POSTGRES_DB: paragraf
    ports:
      - "127.0.0.1:5432:5432"            # reachable from this Mac only, not from the network
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paragraf -d paragraf"]
      interval: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      PARAGRAF_DATABASE_URL: postgresql://paragraf:paragraf@db:5432/paragraf
      PARAGRAF_LLM_BASE_URL: http://host.docker.internal:11434/v1   # Ollama keeps running on the host
      PARAGRAF_LLM_MODEL: ${PARAGRAF_LLM_MODEL:-qwen2.5:14b}
      PARAGRAF_DEVICE: cpu
      HF_HOME: /hf                                                  # reuse the host's model cache
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ${HF_CACHE:-${HOME}/.cache/huggingface}:/hf
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      start_period: 180s                                            # models load on startup
      retries: 6

volumes:
  pgdata:
