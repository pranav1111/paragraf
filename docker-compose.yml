services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: paragraf
      POSTGRES_PASSWORD: paragraf        # local development only; Project 3 moves secrets out of files
      POSTGRES_DB: paragraf
    ports:
      - "127.0.0.1:5432:5432"            # reachable from this Mac only, not from the network
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paragraf -d paragraf"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
