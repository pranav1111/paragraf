<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paragraf</title>
<style>
  :root { --bg:#f7f7f5; --card:#fff; --ink:#1d2230; --muted:#5b6275; --line:#e2e4ea; --accent:#3949ab; --soft:#eceffa; --warn:#9a6b00; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14161c; --card:#1d2029; --ink:#e8eaf0; --muted:#9aa1b1; --line:#2c303b; --accent:#8c9eff; --soft:#252a3d; --warn:#e0b44a; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.55 -apple-system, "Segoe UI", system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 40px 16px 64px; }
  h1 { margin:0; font-size: 30px; letter-spacing:-0.01em; }
  .sub { color:var(--muted); margin: 4px 0 24px; }
  form { display:flex; gap:8px; }
  textarea { flex:1; resize:vertical; min-height:52px; padding:12px 14px; font:inherit; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:10px; }
  button { padding: 0 20px; font:600 15px/1 inherit; color:#fff; background:var(--accent); border:0; border-radius:10px; cursor:pointer; }
  button:disabled { opacity:.55; cursor:wait; }
  .examples { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 28px; }
  .examples button { padding:6px 10px; font:13px/1.3 inherit; color:var(--accent); background:var(--soft); border-radius:999px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px 22px; }
  .answer { margin:0; font-size:17px; white-space:pre-wrap; }
  .cite { color:var(--accent); font-weight:600; text-decoration:none; }
  .badge { display:inline-block; font:600 12px/1 inherit; padding:4px 8px; border-radius:6px; margin-bottom:10px; color:var(--warn); background:color-mix(in srgb, var(--warn) 14%, transparent); }
  ol { margin:18px 0 0; padding:0; list-style:none; border-top:1px solid var(--line); }
  li { display:grid; grid-template-columns: 34px 1fr; gap:6px; padding:10px 0; border-bottom:1px solid var(--line); }
  li.cited .n { color:var(--accent); font-weight:700; }
  li:target { background:var(--soft); }
  .n { color:var(--muted); }
  li a { color:inherit; }
  .meta { color:var(--muted); font-size:13px; }
  .timing { margin-top:12px; color:var(--muted); font-size:13px; }
  .error { color:#c62828; }
</style>
</head>
<body>
<main>
  <h1>Paragraf</h1>
  <p class="sub">Cited answers about the GDPR, the EU AI Act and NIS2, in German or English. Not legal advice.</p>
  <form id="form">
    <textarea id="q" rows="2" maxlength="1000" placeholder="Ask a question, e.g. Wann muss eine Datenpanne gemeldet werden?" required></textarea>
    <button id="go" type="submit">Ask</button>
  </form>
  <div class="examples" id="examples"></div>
  <section id="out" aria-live="polite"></section>
</main>
<script>
const EXAMPLES = ["Wann muss eine Datenpanne gemeldet werden?", "Which AI practices are prohibited?",
                  "What fines can be imposed under the GDPR?", "Muss mein Unternehmen einen Datenschutzbeauftragten benennen?"];
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

for (const q of EXAMPLES) {
  const b = el("button", null, q); b.type = "button";
  b.onclick = () => { $("q").value = q; $("form").requestSubmit(); };
  $("examples").append(b);
}
$("q").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); } });

// The answer is untrusted model output: build DOM nodes with textContent, never innerHTML.
function renderAnswer(text) {
  const p = el("p", "answer");
  for (const part of text.split(/(\[\d+\])/)) {
    const m = part.match(/^\[(\d+)\]$/);
    if (m) { const a = el("a", "cite", part); a.href = "#src-" + m[1]; p.append(a); }
    else p.append(document.createTextNode(part));
  }
  return p;
}

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const question = $("q").value.trim(); if (question.length < 3) return;
  $("go").disabled = true; $("out").replaceChildren(el("p", "meta", "Searching the law texts and writing an answer…"));
  try {
    const res = await fetch("/ask", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ question }) });
    if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
    const data = await res.json();
    const card = el("div", "card");
    if (data.abstained) card.append(el("span", "badge", "Not covered by the indexed laws"));
    card.append(renderAnswer(data.answer));
    const list = el("ol");
    for (const s of data.sources) {
      const li = el("li", s.cited ? "cited" : ""); li.id = "src-" + s.n;
      const body = el("div"); const a = el("a", null, `${s.law} Art. ${s.article} – ${s.title}`);
      a.href = s.url; a.target = "_blank"; a.rel = "noopener";
      body.append(a, el("div", "meta", `${s.lang.toUpperCase()}${s.cited ? " · cited" : ""}`));
      li.append(el("span", "n", `[${s.n}]`), body); list.append(li);
    }
    card.append(list, el("div", "timing", `search ${data.timings_ms.retrieve} ms · answer ${data.timings_ms.generate} ms`));
    $("out").replaceChildren(card);
  } catch (err) {
    $("out").replaceChildren(el("p", "error", "Something went wrong: " + err.message));
  } finally { $("go").disabled = false; }
});
</script>
</body>
</html>
