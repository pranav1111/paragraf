[project]
name = "paragraf"
version = "0.1.0"
description = "Cited, evaluated RAG assistant for EU digital law (GDPR, AI Act, NIS2) in German and English"
authors = [
    { name = "Pranav Chengappa D B", email = "pranavbopanna@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.152.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "numpy>=2.5.4",
    "openai>=3.35.1",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "sentence-transformers>=6.1.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anthropic>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
markers = ["integration: needs PostgreSQL, downloaded models or Ollama"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
